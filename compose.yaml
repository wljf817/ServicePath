services:
  servicepath:
    image: servicepath:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      SERVICEPATH_CONFIG: /config/servicepath.json
    ports:
      - "${SERVICEPATH_BIND_ADDRESS:-127.0.0.1}:${SERVICEPATH_PORT:-5050}:5050"
    volumes:
      - "${SERVICEPATH_CONFIG_FILE:-./servicepath.config.example.json}:/config/servicepath.json:ro"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 60s
