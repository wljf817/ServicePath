services:
  servicepath:
    image: servicepath:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_API_MODE: "${OPENAI_API_MODE:-auto}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.6}"
      REMOTE_SERVICE_URL: "${REMOTE_SERVICE_URL:-}"
      SERVICEPATH_API_TOKEN: "${SERVICEPATH_API_TOKEN:?Set SERVICEPATH_API_TOKEN in .env}"
      SERVICEPATH_DATA_DIR: /data
      SETTINGS_PASSWORD: "${SETTINGS_PASSWORD:?Set SETTINGS_PASSWORD in .env}"
    ports:
      - "${SERVICEPATH_BIND_ADDRESS:-127.0.0.1}:${SERVICEPATH_PORT:-5050}:5050"
    volumes:
      - servicepath-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    stop_grace_period: 60s

volumes:
  servicepath-data:
